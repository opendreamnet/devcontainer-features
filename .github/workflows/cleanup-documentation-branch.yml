name: "Clean up documentation branch"

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  cleanup:
    if: >-
      ${{
        !github.event.pull_request.merged &&
        startsWith(github.event.pull_request.head.ref, 'automated-documentation-update-') &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete closed documentation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
